<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dongrilla Grocery Mart</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:30px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:350px;
margin:auto;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:10px;
margin:10px 0;
}

button{
width:95%;
padding:12px;
margin-top:10px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input type="text" placeholder="Mobile Number">

<input type="password" placeholder="Password">

<button>Login</button>

<button>Create Account</button>
</div>

</body>
</html>
