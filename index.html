<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dongrilla Grocery Mart</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:0;
background:#f5f5f5;
}

header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
}

.banner{
background:#4caf50;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.search{
padding:15px;
text-align:center;
}

.search input{
width:80%;
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
}

.card{
background:white;
padding:20px;
text-align:center;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
background:#2e7d32;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
font-size:16px;
}

.order{
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<header>
<h1>Dongrilla Grocery Mart</h1>
</header>

<div class="banner">
🎉 Daily Offers Available 🎉
</div>

<div class="search">
<input type="text" placeholder="Search products...">
</div>

<div class="categories">

<div class="card">🥦 Grocery</div>

<div class="card">🥤 Beverages</div>

<div class="card">🎂 Cakes</div>

<div class="card">🧁 Pastries</div>

<div class="card">🍕 Food</div>

<div class="card">🔥 Special Offers</div>

</div>

<div class="order">
<button>Order Now</button>
</div>

</body>
</html>
